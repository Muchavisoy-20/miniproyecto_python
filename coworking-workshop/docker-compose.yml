version: '3.8'

services:
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - BREAK_CONTRACT=false
    networks:
      - coworking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - HTTP_TIMEOUT_SECONDS=3.0
    depends_on:
      catalog-service:
        condition: service_started
    networks:
      - coworking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  coworking-network:
    name: coworking_coworking-network
    driver: bridge
